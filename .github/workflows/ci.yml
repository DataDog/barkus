name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to least-privilege; jobs that need more declare it explicitly.
permissions:
  contents: read

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust-fmt:
    name: Rust / rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-06
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  rust-clippy:
    name: Rust / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-06
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-debug
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust / test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-06
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-coverage
      - uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-llvm-cov
      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --cobertura --output-path rust-cobertura.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: rust-cobertura.xml
          if-no-files-found: error
          retention-days: 7

  go-fmt:
    name: Go / gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l ./go)
          if [ -n "$unformatted" ]; then
            echo "::error::The following Go files are not gofmt'd:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

  go-lint:
    name: Go / golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-06
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ffi-release
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build FFI (cgo dep for go vet/lint)
        run: make ffi
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          working-directory: go

  go-test:
    name: Go / test + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-05-06
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: rust-ffi-release
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build FFI
        run: make ffi
      - name: Run tests with coverage
        run: |
          set -euo pipefail
          go test -covermode=atomic \
            -coverpkg=./go/... \
            -coverprofile=coverage.out \
            ./go/pkg/barkus/...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-go
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  coverage-upload:
    name: Coverage / Datadog upload
    needs: [rust-test, go-test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DD_SITE: datadoghq.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Full history so datadog-ci can compute the PR diff vs base
          # for per-line coverage regression annotations.
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-rust
          path: coverage
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-go
          path: coverage
      - name: Get Datadog credentials
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: barkus-code-coverage
      - name: Install datadog-ci
        run: npm install -g @datadog/datadog-ci@5.16.1
      - name: Upload Rust coverage
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        run: datadog-ci coverage upload --flags language:rust coverage/rust-cobertura.xml
      - name: Upload Go coverage
        env:
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
        run: datadog-ci coverage upload --flags language:go coverage/coverage.out

  license-3rdparty:
    name: License Attribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install dd-license-attribution
        run: pip install git+https://github.com/DataDog/dd-license-attribution.git
      - name: Generate LICENSE-3rdparty.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dd-license-attribution generate-sbom-csv \
            --only-transitive-dependencies \
            https://github.com/${{ github.repository }} > LICENSE-3rdparty.csv.tmp
      - name: Check LICENSE-3rdparty.csv is up to date
        run: |
          if ! diff -q LICENSE-3rdparty.csv LICENSE-3rdparty.csv.tmp > /dev/null 2>&1; then
            echo "::error::LICENSE-3rdparty.csv is out of date. Run 'make license-3rdparty' and commit the result."
            diff LICENSE-3rdparty.csv LICENSE-3rdparty.csv.tmp || true
            exit 1
          fi
