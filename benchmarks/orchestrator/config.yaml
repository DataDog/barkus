        fuzz_func: FuzzRaw

  - id: html5ever
    tier: 2
    lang: rust
    engine: libfuzzer
    grammar: null
    pin:
      crate_version: 0.27.0
    harness_dir: benchmarks/suts/html5ever/target/x86_64-unknown-linux-gnu/release
    variants:
      - id: barkus_strict
        kind: barkus
      - id: barkus_nearvalid
        kind: barkus
      - id: barkus_havoc
        kind: barkus
      - id: arbitrary
        kind: arbitrary
      - id: raw
        kind: raw

  - id: libxml2
    tier: 1
    lang: c
    engine: libfuzzer   # M6 deviation from plan's AFL++ choice; see PROGRESS Notes
    grammar: null       # Tiny XML EBNF embedded in harness.c
    pin:
      repo: https://gitlab.gnome.org/GNOME/libxml2.git
      commit: host-2.9.13
      tag: host-2.9.13
    harness_dir: benchmarks/suts/libxml2
    variants:
